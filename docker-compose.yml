# Base de datos desechable para los tests de la API (PostgreSQL 17 + PostGIS).
# Arrancar: npm run db:test:up
services:
  db-test:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: furrly_test
    ports:
      - '54329:5432'
    # En memoria: más rápido y no deja datos entre reinicios.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d furrly_test']
      interval: 2s
      timeout: 3s
      retries: 15
