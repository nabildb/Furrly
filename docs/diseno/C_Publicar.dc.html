<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Furrly C · Publicar aviso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2430}a:hover{color:#C2410C}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBFAF7; color: #1B2430; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="C_Avisos.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E4E2DC; background: #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2430" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
      <span style="font-size: 14px; font-weight: 800; color: #5B6472">Paso 1 de 3</span>
      <span style="width: 44px"></span>
    </div>
    <div role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-label="Progreso" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <span style="height: 6px; border-radius: 3px; background: #C2410C"></span>
      <span style="height: 6px; border-radius: 3px; background: #E8E5DE"></span>
      <span style="height: 6px; border-radius: 3px; background: #E8E5DE"></span>
    </div>
  </header>

  <div style="flex: 1; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: -0.8px">¿Qué ha pasado?</h1>

    <div role="radiogroup" aria-label="Tipo de aviso" style="display: flex; flex-direction: column; gap: 12px">
      <button role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 22px; border: 2px solid #C2410C; background: #FFFFFF; text-align: left; color: #1B2430; box-shadow: 0 6px 18px rgba(194,65,12,0.12)">
        <span style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: #C2410C; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 16px">He perdido a mi mascota</span>
          <span style="font-size: 14px; font-weight: 600; color: #5B6472">Avisaremos a los vecinos de la zona</span>
        </span>
      </button>
      <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 22px; border: 2px solid #EEECE6; background: #FFFFFF; text-align: left; color: #1B2430">
        <span style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: #1E5BB8; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 16px">He encontrado un animal</span>
          <span style="font-size: 14px; font-weight: 600; color: #5B6472">Ayúdale a volver a casa</span>
        </span>
      </button>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 800">¿Quién se ha perdido?</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{pets}}" as="p" hint-placeholder-count="3">
          <button aria-pressed="{{p.pressed}}" style="padding: 12px 0; border-radius: 20px; border: {{p.border}}; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #1B2430">
            <span style="width: 60px; height: 60px; border-radius: 20px; background: {{p.bg}}"></span>
            <span style="font-size: 15px; font-weight: 800">{{p.name}}</span>
          </button>
        </sc-for>
      </div>
    </fieldset>
  </div>

  <div style="padding: 16px 20px 24px">
    <a href="#" style="height: 60px; border-radius: 18px; background: #1B2430; color: #FFFFFF; font-family: 'Unbounded', sans-serif; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
      Siguiente: dónde y cuándo
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      pets: [
        { name: 'Luna', bg: '#F6D9C8', border: '2px solid #C2410C', pressed: 'true' },
        { name: 'Toby', bg: '#EFE3CF', border: '2px solid #EEECE6', pressed: 'false' },
        { name: 'Mía', bg: '#E2E5EE', border: '2px solid #EEECE6', pressed: 'false' }
      ]
    };
  }
}
</script>
</body>
</html>
