# Dependabot abre PRs con las actualizaciones; las de seguridad llegan además en cuanto se publican.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Los tipos de Node deben ir con la versión que usamos (24): solo cambian de versión mayor a mano.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dependencias:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
