name: CodeQL

# Análisis estático de seguridad de GitHub (inyecciones, XSS, secretos en el código...).
# Los avisos aparecen en la pestaña Security del repositorio.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # cada lunes, por si aparecen reglas nuevas

jobs:
  analyze:
    name: Analizar (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
