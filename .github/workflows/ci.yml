name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Cada lunes aunque no haya cambios: una vulnerabilidad nueva en una dependencia no espera a que se abra un PR.
  schedule:
    - cron: '0 7 * * 1'

jobs:
  api:
    name: API (typecheck, tests, build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54329/furrly_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:54329/furrly_test
    services:
      db-test:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: furrly_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d furrly_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Seguridad: nada de SQL construido a mano sin parámetros (la vía típica de una inyección SQL con Prisma)...
      - name: Sin SQL crudo sin parámetros
        run: |
          if grep -rnE --exclude-dir=generated '\$(queryRaw|executeRaw)Unsafe' apps/api/src; then
            echo "::error::Usa \$queryRaw/\$executeRaw con tagged templates (parametrizado), nunca las variantes Unsafe"
            exit 1
          fi
      # ...y ninguna vulnerabilidad alta conocida en las dependencias de producción.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck -w @furrly/api
      - run: npm test -w @furrly/api
      - run: npm run build -w @furrly/api

  web:
    name: Web (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w @furrly/web
      - run: npm run typecheck:test -w @furrly/web
      - run: npm test -w @furrly/web
      - run: npm run build -w @furrly/web

  e2e:
    name: Web end-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w @furrly/web
      # Si algo falla, el informe con capturas y trazas queda descargable en la ejecución.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
