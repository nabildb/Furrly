name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (typecheck, tests, build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54329/furrly_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:54329/furrly_test
    services:
      db-test:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: furrly_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d furrly_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck -w @furrly/api
      - run: npm test -w @furrly/api
      - run: npm run build -w @furrly/api

  web:
    name: Web (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w @furrly/web
      - run: npm run typecheck:test -w @furrly/web
      - run: npm test -w @furrly/web
      - run: npm run build -w @furrly/web
