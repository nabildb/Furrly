# Blueprint de Render para la API (https://render.com/docs/blueprint-spec).
# Los secretos (sync: false) se rellenan en el panel de Render al crear el Blueprint.
services:
  - type: web
    name: furrly-api
    runtime: node
    plan: free
    region: frankfurt # cerca de Supabase (eu-central-1)
    # Solo despliega cuando la CI de GitHub ha pasado.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
        - render.yaml
    buildCommand: npm ci && npm run build -w @furrly/api && npm run db:deploy -w @furrly/api
    startCommand: npm start -w @furrly/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: TRUST_PROXY
        value: '1'
      - key: SUPABASE_URL
        value: https://dgaiisrusilbieffjcdh.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
